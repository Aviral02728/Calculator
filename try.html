<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Premium Dark Ambient Background */
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 150% 150%;
            animation: darkFlow 20s ease-in-out infinite alternate;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Keyframes for Subtle Dark Background Movement */
        @keyframes darkFlow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        /* Entrance Animation */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Premium Dark Glass Body */
        .calc-body {
            background: rgba(30, 41, 59, 0.7); /* Deep Slate Glass */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            animation: fadeSlideUp 0.6s ease-out forwards;
            width: 100%;
            max-width: 360px;
        }

        /* Screen Area */
        .screen-container {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        /* Grid Layout */
        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 4px;
        }

        /* Base Button Styling - Sleek & Modern */
        .calc-btn {
            border: none;
            outline: none;
            font-size: 1.25rem;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease-out;
            color: #e2e8f0; /* Slate-200 */
            /* Default Dark Button */
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .calc-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-1px);
        }

        .calc-btn:active {
            transform: translateY(1px);
            background: rgba(255, 255, 255, 0.02);
        }

        /* --- Eye-Catching Professional Accents --- */
        
        /* Operators: Electric Indigo to Violet Gradient */
        .btn-op {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-op:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            opacity: 0.9;
        }

        /* Action Keys (AC, DEL): Sophisticated Muted Styling */
        .btn-action {
            background: rgba(255, 255, 255, 0.03);
            color: #f87171; /* Professional muted red */
            font-size: 1rem;
            letter-spacing: 0.05em;
        }
        .btn-action:hover {
            background: rgba(248, 113, 113, 0.1);
        }

        /* Equal Button: Vibrant Cyan for Clear "Go" Signal */
        .btn-equal {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
        }
        .btn-equal:hover {
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }

        .span-two {
            grid-column: span 2;
        }

        /* Text Styles */
        #current-operand {
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        /* Responsive Adjustments */
        @media (max-width: 640px) {
            .calc-body {
                padding: 1.25rem;
                border-radius: 24px;
            }
            .calc-btn {
                padding: 14px 0;
            }
            #current-operand {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body class="p-4">

    <!-- Calculator Container -->
    <div class="calc-body p-6 flex flex-col gap-6">
        
        <!-- Header / Decoration -->
        <div class="flex justify-between items-center px-1 opacity-80">
            <span class="text-slate-400 font-semibold tracking-wide text-xs uppercase">Pro Calc</span>
            <div class="flex space-x-1.5">
                <div class="w-2 h-2 rounded-full bg-slate-600"></div>
                <div class="w-2 h-2 rounded-full bg-slate-600"></div>
            </div>
        </div>

        <!-- Display Screen -->
        <div class="screen-container rounded-2xl p-5 h-32 flex flex-col items-end justify-end relative overflow-hidden">
            <div id="previous-operand" class="text-slate-400 text-sm h-6 mb-1 font-medium tracking-wide"></div>
            <div id="current-operand" class="text-5xl font-medium break-all w-full text-right">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="calculator-grid">
            <button data-action="clear" class="calc-btn span-two btn-action">AC</button>
            <button data-action="delete" class="calc-btn btn-action">DEL</button>
            <button data-operation="/" class="calc-btn btn-op">÷</button>
            
            <button data-number class="calc-btn">7</button>
            <button data-number class="calc-btn">8</button>
            <button data-number class="calc-btn">9</button>
            <button data-operation="*" class="calc-btn btn-op">×</button>
            
            <button data-number class="calc-btn">4</button>
            <button data-number class="calc-btn">5</button>
            <button data-number class="calc-btn">6</button>
            <button data-operation="-" class="calc-btn btn-op">−</button>
            
            <button data-number class="calc-btn">1</button>
            <button data-number class="calc-btn">2</button>
            <button data-number class="calc-btn">3</button>
            <button data-operation="+" class="calc-btn btn-op">+</button>
            
            <button data-number class="calc-btn">.</button>
            <button data-number class="calc-btn">0</button>
            <button data-action="calculate" class="calc-btn span-two btn-equal">=</button>
        </div>
    </div>

    <script>
        // State variables
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;

        // Select DOM elements
        const currentOperandTextElement = document.getElementById('current-operand');
        const previousOperandTextElement = document.getElementById('previous-operand');
        const buttons = document.querySelectorAll('button');

        // Formats number for display (adds commas)
        function getDisplayNumber(number) {
            const stringNumber = number.toString();
            const integerDigits = parseFloat(stringNumber.split('.')[0]);
            const decimalDigits = stringNumber.split('.')[1];
            let integerDisplay;
            if (isNaN(integerDigits)) {
                integerDisplay = '';
            } else {
                integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
            }
            if (decimalDigits != null) {
                return `${integerDisplay}.${decimalDigits}`;
            } else {
                return integerDisplay;
            }
        }

        // Update the UI Display
        function updateDisplay() {
            currentOperandTextElement.innerText = getDisplayNumber(currentOperand);
            if (operation != null) {
                previousOperandTextElement.innerText = `${getDisplayNumber(previousOperand)} ${operation}`;
            } else {
                previousOperandTextElement.innerText = '';
            }
        }

        // Logic to clear the calculator
        function clear() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
        }

        // Logic to delete the last character
        function deleteNumber() {
            if (currentOperand === '0') return;
            currentOperand = currentOperand.toString().slice(0, -1);
            if (currentOperand === '') currentOperand = '0';
        }

        // Logic to append a number
        function appendNumber(number) {
            if (number === '.' && currentOperand.includes('.')) return;
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number.toString();
            } else {
                currentOperand = currentOperand.toString() + number.toString();
            }
        }

        // Logic to select an operation
        function chooseOperation(op) {
            if (currentOperand === '') return;
            if (previousOperand !== '') {
                compute();
            }
            operation = op;
            previousOperand = currentOperand;
            currentOperand = '';
        }

        // Core Calculation Logic
        function compute() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);

            if (isNaN(prev) || isNaN(current)) return;

            if (operation === '+') {
                computation = prev + current;
            } else if (operation === '-') {
                computation = prev - current;
            } else if (operation === '*') {
                computation = prev * current;
            } else if (operation === '/') {
                if (current === 0) {
                    currentOperandTextElement.style.color = '#ef4444'; // Red-500
                    setTimeout(() => currentOperandTextElement.style.color = '#ffffff', 1000);
                    // Using custom UI notification instead of alert is better, but keeping simple for this logic
                    // alert("Cannot divide by zero!"); 
                    // Let's just reset quietly for better UX in "Pro" mode or show error on screen
                    currentOperand = "Error";
                    operation = undefined;
                    previousOperand = '';
                    updateDisplay();
                    // Reset after short delay
                    setTimeout(() => { clear(); updateDisplay(); }, 1500);
                    return;
                }
                computation = prev / current;
            } else {
                return;
            }

            currentOperand = computation;
            operation = undefined;
            previousOperand = '';
        }

        // Add Event Listeners
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                if (navigator.vibrate) navigator.vibrate(5); // Subtler vibration for "Pro" feel

                if (button.hasAttribute('data-number')) {
                    if (currentOperand === "Error") clear(); // Auto clear error on new input
                    appendNumber(button.innerText);
                    updateDisplay();
                } else if (button.hasAttribute('data-operation')) {
                    if (currentOperand === "Error") return;
                    chooseOperation(button.getAttribute('data-operation'));
                    updateDisplay();
                } else if (button.getAttribute('data-action') === 'clear') {
                    clear();
                    updateDisplay();
                } else if (button.getAttribute('data-action') === 'delete') {
                    if (currentOperand === "Error") clear();
                    deleteNumber();
                    updateDisplay();
                } else if (button.getAttribute('data-action') === 'calculate') {
                    compute();
                    updateDisplay();
                }
            });
        });

        // Add Keyboard Support
        document.addEventListener('keydown', (e) => {
            if ((e.key >= 0 && e.key <= 9) || e.key === '.') {
                if (currentOperand === "Error") clear();
                appendNumber(e.key);
                updateDisplay();
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                compute();
                updateDisplay();
            }
            if (e.key === 'Backspace') {
                if (currentOperand === "Error") clear();
                deleteNumber();
                updateDisplay();
            }
            if (e.key === 'Escape') {
                clear();
                updateDisplay();
            }
            if (['+', '-', '*', '/'].includes(e.key)) {
                if (currentOperand === "Error") return;
                chooseOperation(e.key);
                updateDisplay();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
